name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl => fully static: runs on any Linux with kernel >= 3.2,
          # including old-glibc hosts that gnu builds from ubuntu-22.04+
          # runners (glibc >= 2.35) cannot reach.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # macos-13 (last Intel runner) is retired — cross-compile the
          # x86_64 slice on Apple Silicon instead (SDKs are multi-arch).
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          {
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cc-uplink
          target: ${{ matrix.target }}
          # Never auto-select `cross`: its bootstrap assumes an x86_64 host
          # and breaks on the arm64 runner. Every matrix row builds natively
          # (or Apple cross-arch) with plain cargo.
          build-tool: cargo
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

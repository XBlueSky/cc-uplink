name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheapest gate in the file and the one with the nastiest failure mode, so
      # it runs before the toolchain is even installed. A server-version pin that
      # drifts from Cargo.toml means Claude Code installs a new plugin and
      # launcher.sh silently downloads the old server binary.
      - name: Version pins agree (Cargo.toml / plugin.json / server-version)
        run: ./scripts/sync-versions.sh --check
      - name: Install tmux (integration tests spin private-socket servers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --test tmux_integration -- --test-threads=1

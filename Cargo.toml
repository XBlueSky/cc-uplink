[package]
name = "cc-uplink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Claude Code's unified outbound channel layer (MCP server + CLI)"
repository = "https://github.com/XBlueSky/cc-uplink"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
